name: Secret scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Gitleaks (full repo scan)
        run: |
          set -euo pipefail
          VER="8.24.3"
          # Unpack OUTSIDE the workspace. The tarball ships README.md + LICENSE
          # alongside the binary; extracting here put them in the scan path, and
          # gitleaks' own README documents an example Sidekiq credential — so
          # `detect --source=.` flagged the scanner's docs as a leak in the repo
          # and this job failed on every run from its introduction (59e319b).
          BIN="${RUNNER_TEMP}/gitleaks"
          mkdir -p "$BIN"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C "$BIN"
          "$BIN/gitleaks" detect --source=. --no-git --redact --report-format sarif --report-path results.sarif
      - name: Upload SARIF artifact
        # always() so the report survives a failing scan — without it the SARIF
        # is dropped exactly when a finding needs investigating.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-results.sarif
          path: results.sarif
          if-no-files-found: warn